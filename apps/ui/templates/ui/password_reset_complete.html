{% extends "base.html" %}
{% load static %}
{% block title %}
    Mot de passe réinitialisé — FactPulse Billing
{% endblock title %}
{% block content_anonymous %}
    <div class="login-container">
        <div class="auth-brand">
            <img src="{% static 'images/logo/logo.png' %}"
                 alt="FactPulse"
                 width="712"
                 height="512">
        </div>
        <h1 class="login-title">Mot de passe modifié</h1>
        <p class="login-body">Votre mot de passe a été réinitialisé avec succès.</p>
        <a href="{% url 'ui:login' %}" class="text-center">
            <button type="button" class="login-btn">Se connecter</button>
        </a>
    </div>
{% endblock content_anonymous %}
