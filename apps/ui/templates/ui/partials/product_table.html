{% load ui_format %}
<table>
    <thead>
        <tr>
            <th>Nom</th>
            <th>Référence</th>
            <th class="num">Prix HT</th>
            <th class="num">TVA</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for p in products %}
            <tr {% if p.archived %}class="row-archived"{% endif %}>
                <td class="cell-strong">{{ p.name }}</td>
                <td class="cell-muted">{{ p.reference|default:"—" }}</td>
                <td class="num">{{ p.default_unit_price|eur }}</td>
                <td class="num">{{ p.default_vat_rate|percent }}</td>
                <td class="actions-cell">
                    <a href="{% url 'ui:product_edit' uuid=p.uuid %}" class="btn-sm">Modifier</a>
                    <form method="post"
                          action="{% url 'ui:product_archive' uuid=p.uuid %}"
                          class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn-sm secondary">
                            {% if p.archived %}
                                Restaurer
                            {% else %}
                                Archiver
                            {% endif %}
                        </button>
                    </form>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="5" class="empty-row">Aucun produit</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% include "ui/partials/_pagination.html" %}
